[project]
name = "laoshiren-backend"
version = "0.1.0"
description = "Laoshiren personal agent backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=3.0,<4.0",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "sqlalchemy>=2.0.52",
    "pypdf>=6.16.2",
    "redis>=6.0,<7.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests", "tests/evals"]
markers = [
    "database: requires the local PostgreSQL development database",
    "live_model: consumes a configured real model provider",
    "gate_a: Backend Freeze Gate A — live user journey (requires RUN_MODEL_EVALS)",
    "gate_b: Backend Freeze Gate B — safety and consistency",
    "gate_c: Backend Freeze Gate C — resilience and recovery",
    "gate_d: Backend Freeze Gate D — agent quality evals",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["laoshiren"]
mypy_path = "src"
