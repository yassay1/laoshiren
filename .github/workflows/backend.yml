name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: laoshiren
          POSTGRES_PASSWORD: laoshiren
          POSTGRES_DB: laoshiren
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U laoshiren -d laoshiren"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://laoshiren:laoshiren@localhost:5432/laoshiren
      RUN_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run ruff check src tests evals scripts
      - run: uv run mypy --strict src
      - run: uv run pytest -q
